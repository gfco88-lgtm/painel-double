<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalogador Double</title>

<style>
body {
    background-color: #0f1115;
    margin: 0;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.grid {
    width: 95%;
    max-width: 1500px;
    display: grid;
    grid-template-columns: repeat(20, 1fr);
    gap: 6px;
}

.cell {
    width: 100%;
    padding-top: 100%;
    position: relative;
    border-radius: 6px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    font-size: 13px;
}

.red {
    background-color: #c0392b;
    color: white;
}

.black {
    background-color: #1e1e1e;
    color: white;
}

.white {
    background-color: #ecf0f1;
    color: black;
}
</style>
</head>

<body>

<div class="grid" id="grid"></div>

<script>
const API_URL = "https://blaze.bet.br/api/roulette_games/recent";

async function fetchData() {
    try {
        const response = await fetch(API_URL);
        const data = await response.json();

        buildGrid(data);

    } catch (error) {
        console.error("Erro ao buscar dados:", error);
    }
}

function buildGrid(data) {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    // inverter para ficar do mais antigo -> mais recente
    data.reverse();

    // pegar apenas últimos 200
    const sliced = data.slice(0, 200);

    sliced.forEach(item => {
        const number = item.roll;

        const div = document.createElement("div");
        div.classList.add("cell");

        if (number === 0) {
            div.classList.add("white");
        } else if (number >= 1 && number <= 7) {
            div.classList.add("red");
        } else {
            div.classList.add("black");
        }

        div.textContent = number;
        grid.appendChild(div);
    });
}

// Atualiza a cada 5 segundos
fetchData();
setInterval(fetchData, 5000);
</script>

</body>
</html>
