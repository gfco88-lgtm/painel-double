<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Double Profissional</title>

<style>
body {
    background: #0f1115;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

.container {
    width: 95%;
    max-width: 1600px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(20, 1fr);
    gap: 6px;
}

.cell {
    width: 100%;
    padding-top: 100%;
    position: relative;
    border-radius: 6px;
    font-size: 12px;
    font-weight: bold;
    text-align: center;
}

.cell span {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

.red {
    background: #c0392b;
}

.black {
    background: #1e1e1e;
}

.white {
    background: #ecf0f1;
    color: #000;
}

.header {
    text-align: center;
    font-size: 18px;
    margin-bottom: 20px;
    letter-spacing: 2px;
    opacity: 0.8;
}
</style>
</head>

<body>

<div class="container">
    <div class="header">PAINEL DOUBLE • TEMPO REAL</div>
    <div class="grid" id="grid"></div>
</div>

<script>
const workerURL = "https://snowy-wave-4493.gfco88.workers.dev";

async function fetchData() {
    try {
        const response = await fetch(workerURL);
        const data = await response.json();
        buildGrid(data);
    } catch (error) {
        console.error("Erro ao buscar dados:", error);
    }
}

function buildGrid(data) {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    // Organizar do mais antigo (embaixo) para o mais recente (em cima)
    data.reverse();

    // Limita em 200 resultados (20 colunas x 10 linhas)
    const sliced = data.slice(0, 200);

    sliced.forEach(item => {
        const number = item.roll;
        const div = document.createElement("div");
        div.classList.add("cell");

        if (number === 0) {
            div.classList.add("white");
        } else if (number <= 7) {
            div.classList.add("red");
        } else {
            div.classList.add("black");
        }

        div.innerHTML = `<span>${number}</span>`;
        grid.appendChild(div);
    });
}

// Atualiza a cada 5 segundos
fetchData();
setInterval(fetchData, 5000);
</script>

</body>
</html>
