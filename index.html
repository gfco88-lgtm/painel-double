<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAINEL DOUBLE • TEMPO REAL</title>

<style>
body{
    background:#0f1115;
    margin:0;
    font-family:Arial, sans-serif;
    text-align:center;
    color:white;
}
h1{
    margin:15px 0;
    font-size:18px;
}
.grid{
    width:95%;
    max-width:1500px;
    margin:0 auto;
    display:grid;
    grid-template-columns:repeat(20,1fr);
    gap:5px;
}
.cell{
    width:100%;
    padding-top:100%;
    position:relative;
    border-radius:6px;
    font-weight:bold;
    font-size:13px;
}
.cell span{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}
.red{background:#c0392b;}
.black{background:#1e1e1e;}
.white{background:#ecf0f1;color:black;}
</style>
</head>

<body>

<h1>PAINEL DOUBLE • TEMPO REAL</h1>
<div class="grid" id="grid"></div>

<script>

const API = "https://api.allorigins.win/raw?url=https://blaze.bet.br/api/roulette_games/recent";

async function carregar(){
    try{
        const resposta = await fetch(API);
        const dados = await resposta.json();

        montarGrid(dados);
    }catch(e){
        console.log("Erro:", e);
    }
}

function montarGrid(lista){
    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    lista.reverse();
    lista.slice(0,200).forEach(item=>{
        let numero = item.roll;

        let div = document.createElement("div");
        div.classList.add("cell");

        if(numero === 0){
            div.classList.add("white");
        }else if(numero <= 7){
            div.classList.add("red");
        }else{
            div.classList.add("black");
        }

        div.innerHTML = "<span>"+numero+"</span>";
        grid.appendChild(div);
    });
}

carregar();
setInterval(carregar,5000);

</script>

</body>
</html>
